services:
  nginx:
    image: nginx:tf-site
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
