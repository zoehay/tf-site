limit_req_zone $binary_remote_addr zone=armory_apikeys:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=armory_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name gw2-armory.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

}

