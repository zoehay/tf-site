
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        location / {
            return 301 https://$host$request_uri;
        }

    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name  zoemhay.com www.zoemhay.com;
        root         /var/www/static-site;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key  /etc/nginx/certs/localhost.key;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            root /var/www/static-site;
            index index.html;
            try_files $uri /index.html;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name  e-commerce.localhost  www.e-commerce.localhost;
        root /var/www;

        ssl_certificate /etc/nginx/certs/e-commerce.localhost.crt; 
        ssl_certificate_key /etc/nginx/certs/e-commerce.localhost.key;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            root /var/www/frontend/build;
            index index.html;
            try_files $uri /index.html;
        }

        location /api/ {       
            proxy_pass http://e-commerce-backend:8000/; 
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;   
        }
    
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name  angular-e-commerce.localhost  www.angular-e-commerce.localhost;
        root /var/www;

        ssl_certificate /etc/nginx/certs/angular-e-commerce.localhost.crt; 
        ssl_certificate_key /etc/nginx/certs/angular-e-commerce.localhost.key;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            root /var/www/local-angular-e-commerce-app;
            index index.html;
            try_files $uri /index.html;
        }

        location /api/ {       
            proxy_pass http://e-commerce-backend:8000/; 
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;   
        }
    
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name  armory.localhost  www.armory.localhost;
        root /var/www;

        ssl_certificate /etc/nginx/certs/armory.localhost.crt; 
        ssl_certificate_key /etc/nginx/certs/armory.localhost.key;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
            root /var/www/armory/dist;
            index index.html;
            try_files $uri /index.html;
        }

        location /api/ {       
            proxy_pass http://armory-backend:8000/; 
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;   
        }
    
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions

    ssl_dhparam /etc/ssl/dhparam.pem;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    ssl_trusted_certificate /etc/nginx/certs/localhost.crt;

    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;


}
